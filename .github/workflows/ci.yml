name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate source metadata
        run: ./scripts/check-sources

      - name: Check formatting
        run: nix fmt -- --check flake.nix package-cli.nix package-images.nix package-launchers.nix source-cli.nix sources-images.nix

      - name: Flake checks
        run: nix flake check --print-build-logs

      - name: Build all x86_64 stable packages
        run: |
          nix build \
            .#floci \
            .#floci-aws \
            .#floci-aws-compat \
            .#floci-az \
            .#floci-gcp \
            .#floci-oci \
            .#floci-oci-compat \
            .#aws-image \
            .#aws-compat-image \
            .#azure-image \
            .#gcp-image \
            .#oci-image \
            .#oci-compat-image \
            --print-build-logs

      - name: CLI smoke test
        run: nix run .#floci -- --version

      - name: Evaluate aarch64 packages
        run: |
          for package in \
            floci floci-aws floci-aws-compat floci-aws-baseline \
            floci-az floci-gcp floci-oci floci-oci-compat \
            aws-image aws-compat-image aws-baseline-image \
            azure-image gcp-image oci-image oci-compat-image; do
            nix eval --raw ".#packages.aarch64-linux.${package}.drvPath" >/dev/null
          done
